# iPhone derlemesi (UDID'li dahili dağıtım, eas.json → preview) — GitHub'ın macOS makinesinde.
# EAS bulut sırası beklenmez: `eas build --local` derlemeyi bu makinede yapar; imza (sertifika + UDID'li profil) EAS'ten gelir.
# Gerekli gizli anahtar: EXPO_TOKEN (expo.dev → Account settings → Access tokens), depo Settings → Secrets → Actions.
# Başlatma: GitHub → Actions → "iPhone derlemesi" → Run workflow. Çıktı: çalıştırmanın sayfasında "Okul-iPhone" (okul.ipa).
name: iPhone derlemesi

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Xcode sürümü
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bağımlılıklar
        run: npm ci

      - name: EAS CLI
        run: npm install -g eas-cli

      - name: Derle (preview, iOS, yerel)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "EXPO_TOKEN gizli anahtarı eksik (Settings → Secrets → Actions)"; exit 1; fi
          mkdir -p build
          eas build --local --platform ios --profile preview --non-interactive --output build/okul.ipa

      - name: IPA'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Okul-iPhone
          path: build/okul.ipa
          retention-days: 14
