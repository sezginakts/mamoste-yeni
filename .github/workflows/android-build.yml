# Android APK (dahili dağıtım) — GitHub'ın Ubuntu makinesinde, EAS bulut sırası beklemeden.
# `eas build --local` derlemeyi bu makinede yapar; imza anahtarı (keystore) EAS'ten gelir/oluşturulur.
# Gerekli gizli anahtar: EXPO_TOKEN (repository → Settings → Secrets and variables → Actions).
# Başlatma: Actions → "Android APK" → Run workflow. Çıktı: "Okul-Android" (okul.apk).
name: Android APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: EAS CLI
        run: npm install -g eas-cli

      - name: Derle (preview, Android APK, yerel)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "EXPO_TOKEN gizli anahtarı eksik (Settings → Secrets → Actions)"; exit 1; fi
          mkdir -p build
          eas build --local --platform android --profile preview --non-interactive --output build/okul.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Okul-Android
          path: build/okul.apk
