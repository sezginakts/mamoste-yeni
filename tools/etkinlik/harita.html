<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>__BASLIK__</title>
<style>
:root{--mercan:#E2574C;--turkuaz:#0D9488;--gok:#0284C7;--kehribar:#D99A1E;--yazi:#0F172A;--soluk:#64748B;--cizgi:#E2E8F0;--kart:#FFFFFF;--zemin:#F1F5F9;
  --f:clamp(16px,3vmin,42px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--yazi);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(155deg,#E0F2FE 0%,#ECFEFF 45%,#F0FDFA 70%,#FFF7ED 100%);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0}
#arka{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(6vmin);opacity:.3}
.b1{width:45vmin;height:45vmin;background:var(--gok);top:-12vmin;left:-10vmin}
.b2{width:38vmin;height:38vmin;background:var(--turkuaz);bottom:-14vmin;right:-8vmin;opacity:.25}
.b3{width:30vmin;height:30vmin;background:var(--kehribar);bottom:10vmin;left:-12vmin;opacity:.2}
.b4{width:22vmin;height:22vmin;background:var(--mercan);top:6vmin;right:12vmin;opacity:.18}
.ekran{display:none;position:absolute;inset:0}.ekran.aktif{display:flex}
/* ---------- Giriş ---------- */
#giris{align-items:center;justify-content:center;padding:2vmin}
.ucan{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ucan span{position:absolute;font-weight:800;font-size:calc(var(--f)*.75);padding:.45em .8em;border-radius:.6em;background:#fff;border:2px solid;border-bottom-width:.35em;opacity:.55;animation:suz 14s ease-in-out infinite;white-space:nowrap}
@keyframes suz{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-3vmin) rotate(calc(var(--r)*-1))}}
.giris-kart{position:relative;background:rgba(255,255,255,.93);border-radius:4vmin;padding:3.5vmin 5vmin;max-width:min(94vw,124vmin);width:100%;
  box-shadow:0 2vmin 6vmin rgba(2,132,199,.18);text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.6vmin;max-height:96vh;overflow:auto}
.logo{display:flex;gap:1vmin;justify-content:center}
.logo i{display:grid;place-items:center;width:7vmin;height:7vmin;border-radius:1.6vmin;font-style:normal;font-size:4vmin;box-shadow:0 .7vmin 0 rgba(0,0,0,.18)}
.logo i:nth-child(1){background:var(--gok);transform:rotate(-8deg)}.logo i:nth-child(2){background:var(--turkuaz);transform:translateY(-1vmin)}
.logo i:nth-child(3){background:var(--mercan);transform:rotate(7deg)}.logo i:nth-child(4){background:var(--kehribar);transform:translateY(.6vmin) rotate(-4deg)}
.ust-yazi{font-weight:800;letter-spacing:.5em;color:var(--gok);font-size:calc(var(--f)*.55)}
h1{margin:0;font-size:calc(var(--f)*2.1);font-weight:900;line-height:1;background:linear-gradient(90deg,var(--turkuaz),var(--gok));-webkit-background-clip:text;background-clip:text;color:transparent}
.alt{color:var(--soluk);font-size:calc(var(--f)*.6);font-weight:600}
.imza{font-size:calc(var(--f)*.5);color:var(--turkuaz);background:#F0FDFA;border:1px solid #99F6E4;border-radius:99px;padding:.5em 1.2em}
.ayarlar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vmin 2.4vmin;width:100%;margin-top:.6vmin}
.ayar{display:flex;flex-direction:column;gap:.7vmin;text-align:left}
.ayar.genis{grid-column:1/-1}
.ayar>span{font-weight:800;font-size:calc(var(--f)*.5);color:var(--soluk);text-transform:uppercase;letter-spacing:.08em}
.sec{display:flex;background:var(--zemin);border-radius:1.6vmin;padding:.5vmin;gap:.5vmin;flex-wrap:wrap}
.sec button{flex:1 1 auto;background:transparent;border-radius:1.2vmin;padding:1.1vmin .8vmin;font-weight:800;font-size:calc(var(--f)*.55);color:var(--soluk);white-space:nowrap}
.sec button.on{background:#fff;color:var(--yazi);box-shadow:0 .3vmin 1vmin rgba(15,23,42,.12)}
.ipucu-not{font-size:calc(var(--f)*.5);color:var(--kehribar);font-weight:800}
.buyuk{margin-top:.6vmin;background:var(--turkuaz);color:#fff;font-weight:900;font-size:calc(var(--f)*.95);padding:1.6vmin 7vmin;border-radius:99px;box-shadow:0 .9vmin 0 #0F766E;transition:transform .1s}
.buyuk:active{transform:translateY(.6vmin);box-shadow:0 .3vmin 0 #0F766E}
.nasil{font-size:calc(var(--f)*.5);color:var(--soluk);line-height:1.5;max-width:94vmin}
/* ---------- Oyun ---------- */
#oyun{flex-direction:column}
.bar{display:flex;align-items:center;gap:1.5vmin;padding:1.6vmin 2.4vmin .8vmin}
.etiket{font-weight:900;font-size:calc(var(--f)*.55);color:var(--gok);background:#fff;border-radius:99px;padding:.7vmin 1.6vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.ilerleme{flex:1;display:flex;gap:.6vmin;justify-content:center;flex-wrap:wrap}
.ilerleme i{width:1.6vmin;height:1.6vmin;border-radius:50%;background:#CBD5E1}
.ilerleme i.d{background:var(--turkuaz)}.ilerleme i.y{background:var(--kehribar)}.ilerleme i.s{background:var(--gok);transform:scale(1.35)}
.skorlar{display:flex;gap:1vmin}
.skor{background:#fff;border-radius:1.6vmin;padding:.6vmin 1.6vmin;font-weight:900;font-size:calc(var(--f)*.7);display:flex;align-items:center;gap:.8vmin;border:.35vmin solid transparent;transition:all .25s}
.skor small{font-size:.55em;color:var(--soluk);font-weight:800}
.skor.m{color:var(--mercan)}.skor.t{color:var(--turkuaz)}.skor.g{color:var(--gok)}
.skor.sirada{border-color:currentColor;transform:scale(1.08);box-shadow:0 .6vmin 1.6vmin rgba(15,23,42,.12)}
.araclar{display:flex;gap:.8vmin}
.araclar button{width:6vmin;height:6vmin;min-width:36px;min-height:36px;border-radius:50%;background:#fff;font-size:calc(var(--f)*.6);box-shadow:0 .3vmin 1vmin rgba(15,23,42,.08)}
.sure{height:1.1vmin;min-height:6px;margin:0 2.4vmin;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;visibility:hidden}
.sure.var{visibility:visible}
#sureBar{height:100%;width:100%;background:linear-gradient(90deg,var(--turkuaz),var(--gok));border-radius:99px;transition:width .1s linear}
.sure.az #sureBar{background:var(--mercan)}
.sahne{flex:1;display:flex;flex-direction:column;align-items:center;padding:.6vmin 2vmin 1.6vmin;gap:1.2vmin;min-height:0}
.soru-kart{display:flex;align-items:center;gap:2.4vmin;background:rgba(255,255,255,.9);border-radius:3vmin;padding:1vmin 3.5vmin 1vmin 1vmin;box-shadow:0 1vmin 3vmin rgba(2,132,199,.12);max-width:96vw;flex:none}
.resim{width:10vmin;height:10vmin;border-radius:50%;display:grid;place-items:center;font-size:6vmin;line-height:1;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#E0F2FE 60%,#BAE6FD 100%);box-shadow:inset 0 0 0 .7vmin #fff,0 0 0 .5vmin #BAE6FD;animation:nefes 3.2s ease-in-out infinite}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.soru-yan{display:flex;flex-direction:column;gap:.4vmin;align-items:flex-start;min-width:0}
.sira{font-weight:900;font-size:calc(var(--f)*.55);padding:.4vmin 1.6vmin;border-radius:99px;color:#fff;display:none}
.sira.var{display:inline-block}
.soru{font-weight:900;font-size:calc(var(--f)*.95);color:var(--yazi)}
.soru b{color:var(--gok)}
.soru-alt{font-size:calc(var(--f)*.55);color:var(--soluk);font-weight:700}
.secenekler{display:flex;gap:1.4vmin;flex-wrap:wrap;justify-content:center;flex:none;max-width:96vw}
.secenek{--c:var(--gok);font-size:calc(var(--f)*.75);font-weight:800;color:var(--yazi);background:#fff;border:.3vmin solid var(--c);border-bottom-width:.9vmin;border-radius:1.6vmin;padding:1vmin 2.4vmin;transition:transform .12s}
.secenek:active{transform:translateY(.3vmin)}
.secenek.dogru{background:var(--turkuaz);color:#fff;border-color:#0F766E}
.secenek.yanlis{background:var(--mercan);color:#fff;border-color:#B4382E;animation:salla .45s}
@keyframes salla{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-1.2vmin)}40%,80%{transform:translateX(1.2vmin)}}
.sahne-harita{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.harita-kart{position:relative;width:100%;height:100%;max-width:min(96vw,calc((100vh - 26vmin) * 2.3));background:#fff;border-radius:3vmin;box-shadow:0 1.2vmin 4vmin rgba(2,132,199,.16);padding:1.2vmin;display:flex}
.harita-kart svg{width:100%;height:100%;display:block;border-radius:2vmin;touch-action:manipulation}
.harita-kart.dokun svg{cursor:crosshair}
.etiket-sec{position:absolute;right:2vmin;top:2vmin;display:none;background:rgba(255,255,255,.92);border-radius:99px;padding:.4vmin;gap:.4vmin;box-shadow:0 .3vmin 1vmin rgba(15,23,42,.12)}
.etiket-sec.var{display:flex}
.etiket-sec button{background:transparent;border-radius:99px;padding:.8vmin 1.8vmin;font-weight:800;font-size:calc(var(--f)*.5);color:var(--soluk)}
.etiket-sec button.on{background:var(--gok);color:#fff}
.bilgi{position:absolute;left:2vmin;bottom:2vmin;max-width:min(70%,90vmin);background:rgba(255,255,255,.96);border-radius:2vmin;padding:1.4vmin 2vmin;box-shadow:0 .8vmin 2.4vmin rgba(15,23,42,.18);display:none;border-left:1vmin solid var(--gok)}
.bilgi.var{display:block}
.bilgi b{font-size:calc(var(--f)*.75)}
.bilgi p{margin:.4vmin 0 0;font-size:calc(var(--f)*.58);color:var(--soluk);font-weight:600;line-height:1.35}
.kontroller{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center;flex:none}
.kontroller button,.sonuc button{font-weight:900;font-size:calc(var(--f)*.62);border-radius:99px;padding:1.3vmin 3.2vmin;background:#fff;color:var(--yazi);box-shadow:0 .6vmin 0 #CBD5E1;transition:transform .1s}
.kontroller button:active,.sonuc button:active{transform:translateY(.4vmin);box-shadow:0 .2vmin 0 #CBD5E1}
.kontroller button:disabled{opacity:.4;pointer-events:none}
.sonuc button.ana{background:var(--turkuaz);color:#fff;box-shadow:0 .6vmin 0 #0F766E;padding:1.3vmin 4.5vmin}
.sonuc{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:2vmin;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:20}
.sonuc.acik{transform:none}
.sonuc-ic{background:#fff;border-radius:3vmin;padding:2vmin 3.5vmin;box-shadow:0 -1vmin 4vmin rgba(15,23,42,.18);display:flex;align-items:center;gap:3vmin;max-width:96vw;flex-wrap:wrap;justify-content:center;border-top:1vmin solid var(--turkuaz)}
.sonuc.kotu .sonuc-ic{border-top-color:var(--kehribar)}
.sonuc-bas{font-size:calc(var(--f)*1);font-weight:900;color:var(--turkuaz)}
.sonuc.kotu .sonuc-bas{color:var(--kehribar)}
.sonuc-ad{font-size:calc(var(--f)*.75);font-weight:900}
.sonuc-bilgi{font-size:calc(var(--f)*.58);color:var(--soluk);font-weight:600;max-width:60vw}
.sonuc-btn{display:flex;gap:1.2vmin}
#bitis{align-items:center;justify-content:center;padding:2vmin}
.bitis-kart{background:rgba(255,255,255,.95);border-radius:4vmin;padding:4vmin 6vmin;text-align:center;box-shadow:0 2vmin 6vmin rgba(2,132,199,.18);display:flex;flex-direction:column;align-items:center;gap:1.6vmin;max-width:94vw}
.kupa{font-size:16vmin;line-height:1;animation:zipla 1.2s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0)}50%{transform:translateY(-2vmin)}}
.bitis-bas{font-size:calc(var(--f)*1.4);font-weight:900}
.yildiz{font-size:8vmin;letter-spacing:1vmin}
.yildiz b{color:#CBD5E1;font-weight:400}
.bitis-skor{display:flex;gap:3vmin}
.bitis-skor div{background:var(--zemin);border-radius:2vmin;padding:1.6vmin 3vmin;font-weight:900;font-size:calc(var(--f)*1.1)}
.bitis-skor small{display:block;font-size:.45em;color:var(--soluk)}
.bitis-btn{display:flex;gap:1.6vmin;margin-top:1vmin}
.bitis-btn button{font-weight:900;font-size:calc(var(--f)*.65);border-radius:99px;padding:1.5vmin 4vmin;background:#fff;box-shadow:0 .6vmin 0 #CBD5E1}
.bitis-btn button.ana{background:var(--turkuaz);color:#fff;box-shadow:0 .6vmin 0 #0F766E}
.onay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:60}
.onay.acik{display:flex}
.onay div{background:#fff;border-radius:3vmin;padding:3vmin 4vmin;text-align:center;font-weight:800;font-size:calc(var(--f)*.7)}
.onay p{margin:0 0 2vmin}
.onay button{font-weight:900;font-size:calc(var(--f)*.6);border-radius:99px;padding:1.2vmin 3.5vmin;margin:0 .6vmin;background:var(--zemin)}
.onay button.ana{background:var(--mercan);color:#fff}
#konfeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#konfeti i{position:absolute;top:-4vmin;width:1.4vmin;height:2.2vmin;border-radius:.3vmin;animation:dus linear forwards}
@keyframes dus{to{transform:translateY(110vh) rotate(720deg)}}
/* SVG harita */
.il{stroke:#fff;stroke-width:1.1;transition:fill .25s}
.vurgu{animation:parla 1.1s ease-in-out infinite}
@keyframes parla{0%,100%{opacity:1}50%{opacity:.55}}
.yazi{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-weight:800;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
@media (orientation:portrait){
  :root{--f:clamp(15px,4.6vmin,30px)}
  .ayarlar{grid-template-columns:1fr}.etiket{display:none}
  .harita-kart{max-width:96vw;height:auto;aspect-ratio:2.3}
  .sahne-harita{flex:none}
}
</style></head><body>
<div id="arka"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span></div>

<section id="giris" class="ekran aktif">
  <div class="ucan" id="ucan"></div>
  <div class="giris-kart">
    <div class="logo"><i>🗺️</i><i>⛰️</i><i>🌊</i><i>🏙️</i></div>
    <div class="ust-yazi">TÜRKİYE</div>
    <h1>Türkiye Haritası</h1>
    <div class="alt">__ALT__</div>
    __IMZA__
    <div class="ayarlar">
      <div class="ayar genis"><span>Kategori</span><div class="sec" id="katSec" data-k="kat"></div><div class="ipucu-not" id="katNot"></div></div>
      <div class="ayar genis"><span>Kip</span><div class="sec" data-k="kip"><button data-v="kesfet">🔎 Keşfet (öğren)</button><button data-v="hangisi">❓ Hangisi?</button><button data-v="bul">📍 Haritada bul</button></div></div>
      <div class="ayar"><span>Oyuncu</span><div class="sec" data-k="mod"><button data-v="tek">👤 Tek</button><button data-v="takim">👥 İki takım</button></div></div>
      <div class="ayar"><span>Soru sayısı</span><div class="sec" data-k="tur"><button data-v="5">5</button><button data-v="8">8</button><button data-v="10">10</button><button data-v="15">15</button></div></div>
      <div class="ayar genis"><span>Süre (her soru)</span><div class="sec" data-k="sure"><button data-v="0">Yok</button><button data-v="20">20 sn</button><button data-v="40">40 sn</button></div></div>
    </div>
    <button id="basla" class="buyuk">Başla ▶</button>
    <div class="nasil" id="nasil"></div>
  </div>
</section>

<section id="oyun" class="ekran">
  <header class="bar">
    <div class="etiket" id="etiket"></div>
    <div class="ilerleme" id="ilerleme"></div>
    <div class="skorlar" id="skorlar"></div>
    <div class="araclar"><button id="sesBtn" title="Ses">🔊</button><button id="tamBtn" title="Tam ekran">⛶</button><button id="cikBtn" title="Ana ekran">✕</button></div>
  </header>
  <div class="sure" id="sureKap"><div id="sureBar"></div></div>
  <main class="sahne">
    <div class="soru-kart">
      <div class="resim" id="resim"></div>
      <div class="soru-yan">
        <div class="sira" id="sira"></div>
        <div class="soru" id="soru"></div>
        <div class="soru-alt" id="soruAlt"></div>
      </div>
    </div>
    <div class="secenekler" id="secenekler"></div>
    <div class="sahne-harita"><div class="harita-kart" id="haritaKart">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="etiket-sec" id="etiketSec"><button data-v="ad">Ad</button><button data-v="plaka">Plaka</button><button data-v="yok">Etiketsiz</button></div>
      <div class="bilgi" id="bilgi"></div>
    </div></div>
    <div class="kontroller" id="kontroller"><button id="pasBtn">⏭ Pas</button></div>
  </main>
  <div class="sonuc" id="sonuc"><div class="sonuc-ic">
    <div class="sonuc-bas" id="sonucBas"></div>
    <div><div class="sonuc-ad" id="sonucAd"></div><div class="sonuc-bilgi" id="sonucBilgi"></div></div>
    <div class="sonuc-btn"><button id="sonrakiBtn" class="ana">Sonraki ▶</button></div>
  </div></div>
</section>

<section id="bitis" class="ekran">
  <div class="bitis-kart">
    <div class="kupa">🏆</div>
    <div class="bitis-bas" id="bitisBas"></div>
    <div class="yildiz" id="yildiz"></div>
    <div class="bitis-skor" id="bitisSkor"></div>
    <div class="bitis-btn"><button id="ayarBtn">⚙︎ Ayarlar</button><button id="tekrarBtn" class="ana">↻ Tekrar oyna</button></div>
  </div>
</section>

<div class="onay" id="onay"><div><p>Oyun bitirilsin mi?</p><button id="hayirBtn">Devam et</button><button id="evetBtn" class="ana">Bitir</button></div></div>
<div id="konfeti"></div>

<script>
/*__HAVUZ__*/
// Havuz (src/data/activities/haritaHavuzu.js): { sinif, seviye:{tier,options,tolKm,near}, kategoriler, yerler, celdirici, harita:{W,H,iller,komsu,goller,nehirler,kucukGoller} }
// Harita birimi ≈ 1,1 km (eşdikdörtgen projeksiyon, Natural Earth 1:10m).
const H=(typeof HAVUZ!=='undefined'&&HAVUZ&&HAVUZ.harita)?HAVUZ:null;
const $=id=>document.getElementById(id);
if(!H){document.body.innerHTML='<p style="padding:4vmin;font:700 4vmin sans-serif">Harita verisi yok. Bu dosya uygulamadan indirilen oyunla çalışır.</p>'}
const SEV=Object.assign({tier:3,options:4,tolKm:100,near:false},H?H.seviye:{});
const KM=1.11;
const ANAHTAR='mamoste-harita:__ANAHTAR__';
const RENK=['var(--gok)','var(--turkuaz)','var(--mercan)','var(--kehribar)'];
const TAKIM=[{ad:'Mercan',sinif:'m',renk:'var(--mercan)'},{ad:'Turkuaz',sinif:'t',renk:'var(--turkuaz)'}];
const AMBER='#D99A1E';
const oku=(k,v)=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):v}catch(e){return v}};
const yaz=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function karistir(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// --- ses ---
let AC=null,sessiz=oku('mamoste-harita-sessiz',false);
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function ton(f,t0,d,tip,v){const a=ac();if(!a||sessiz)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=tip||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const ses={tik:()=>ton(700,0,.07,'triangle',.1),dogru:()=>[523,659,784,1047].forEach((f,i)=>ton(f,i*.09,.3,'triangle',.16)),
  yanlis:()=>{ton(220,0,.22,'sawtooth',.06);ton(165,.12,.3,'sawtooth',.06)},saat:()=>ton(1200,0,.04,'square',.04),
  final:()=>[523,659,784,659,784,1047,1319].forEach((f,i)=>ton(f,i*.12,.4,'triangle',.15))};

// --- geometri ---
const parse=d=>String(d||'').split('M').filter(Boolean).map(p=>p.replace(/Z/g,'').split('L').map(q=>q.trim().split(/\s+/).map(Number)));
const IL={},RV={},LK={};
if(H){H.harita.iller.forEach(p=>IL[p.n]=parse(p.d));Object.entries(H.harita.nehirler).forEach(([k,d])=>RV[k]=parse(d));Object.entries(H.harita.goller).forEach(([k,d])=>LK[k]=parse(d))}
function sekiller(f){
  if(f.kind==='point')return[{pts:[f.p],kapali:false}];
  if(f.kind==='range')return[{pts:f.line,kapali:false}];
  if(f.kind==='river')return(RV[f.ref]||[]).map(pts=>({pts,kapali:false}));
  if(f.kind==='lake')return(LK[f.ref]||[]).map(pts=>({pts,kapali:true}));
  return(IL[f.ref]||[]).map(pts=>({pts,kapali:true}));
}
function segUzak(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;const t=l?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l)):0;return[Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy),[a[0]+t*dx,a[1]+t*dy]]}
function icinde(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(yi>p[1]!==yj>p[1]&&p[0]<(xj-xi)*(p[1]-yi)/(yj-yi)+xi)c=!c}return c}
// Uzaklık (km) ve yerin dokunuşa en yakın noktası. Göl/il içi = 0.
function uzaklik(f,p){let en=Infinity,q=f.a;
  for(const{pts,kapali}of sekiller(f)){if(kapali&&icinde(p,pts))return[0,p];
    if(pts.length===1){const d=Math.hypot(p[0]-pts[0][0],p[1]-pts[0][1]);if(d<en){en=d;q=pts[0]}}
    for(let i=1;i<pts.length;i++){const[d,x]=segUzak(p,pts[i-1],pts[i]);if(d<en){en=d;q=x}}
    if(kapali&&pts.length>2){const[d,x]=segUzak(p,pts[pts.length-1],pts[0]);if(d<en){en=d;q=x}}}
  return[en*KM,q]}
function ilBul(p){for(const n in IL)if(IL[n].some(pts=>icinde(p,pts)))return n;return null}
