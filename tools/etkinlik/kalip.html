<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>__BASLIK__</title>
<style>
:root{--mercan:#E2574C;--turkuaz:#0D9488;--gok:#0284C7;--kehribar:#D99A1E;--yazi:#0F172A;--soluk:#64748B;--cizgi:#E2E8F0;--kart:#FFFFFF;--zemin:#F1F5F9;
  --f:clamp(17px,3.3vmin,46px);--k:var(--turkuaz)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--yazi);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(155deg,#E0F2FE 0%,#ECFEFF 45%,#F0FDFA 70%,#FFF1EE 100%);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#arka{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(6vmin);opacity:.35}
.b1{width:45vmin;height:45vmin;background:var(--gok);top:-12vmin;left:-10vmin}
.b2{width:38vmin;height:38vmin;background:var(--mercan);bottom:-14vmin;right:-8vmin;opacity:.25}
.b3{width:30vmin;height:30vmin;background:var(--turkuaz);bottom:10vmin;left:-12vmin;opacity:.22}
.b4{width:22vmin;height:22vmin;background:var(--kehribar);top:6vmin;right:12vmin;opacity:.2}
.ekran{display:none;position:absolute;inset:0}.ekran.aktif{display:flex}
/* ---------- Giriş ---------- */
#giris{align-items:center;justify-content:center;padding:2vmin}
.giris-kart{position:relative;background:rgba(255,255,255,.92);border-radius:4vmin;padding:4vmin 5vmin;max-width:min(94vw,130vmin);width:100%;
  box-shadow:0 2vmin 6vmin rgba(2,132,199,.18);text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.8vmin;max-height:96vh;overflow:auto}
.logo{display:flex;gap:1vmin;justify-content:center}
.logo i{display:block;width:7vmin;height:7vmin;border-radius:1.6vmin;font-style:normal;color:#fff;font-weight:900;font-size:4vmin;line-height:7vmin;box-shadow:0 .7vmin 0 rgba(0,0,0,.18)}
.logo i:nth-child(1){background:var(--gok);transform:rotate(-8deg)}.logo i:nth-child(2){background:var(--turkuaz);transform:translateY(-1vmin)}
.logo i:nth-child(3){background:var(--mercan);transform:rotate(7deg)}.logo i:nth-child(4){background:var(--kehribar);transform:translateY(.6vmin) rotate(-4deg)}
.ust-yazi{font-weight:800;letter-spacing:.5em;color:var(--gok);font-size:calc(var(--f)*.55)}
h1{margin:0;font-size:calc(var(--f)*2.1);font-weight:900;line-height:1;background:linear-gradient(90deg,var(--turkuaz),var(--gok));-webkit-background-clip:text;background-clip:text;color:transparent}
.alt{color:var(--soluk);font-size:calc(var(--f)*.6);font-weight:600}
.imza{font-size:calc(var(--f)*.5);color:var(--turkuaz);background:#F0FDFA;border:1px solid #99F6E4;border-radius:99px;padding:.5em 1.2em}
.etk{font-weight:800;font-size:calc(var(--f)*.5);color:var(--soluk);text-transform:uppercase;letter-spacing:.08em;align-self:flex-start}
.kaliplar{display:flex;flex-wrap:wrap;gap:1vmin;justify-content:center;width:100%}
.kaliplar button{--c:var(--gok);font-weight:800;font-size:calc(var(--f)*.55);padding:1vmin 1.8vmin;border-radius:99px;background:#fff;border:.3vmin solid var(--c);border-bottom-width:.7vmin;color:var(--yazi)}
.kaliplar button.on{background:var(--c);color:#fff}
.ayarlar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vmin 2.4vmin;width:100%;margin-top:1vmin}
.ayar{display:flex;flex-direction:column;gap:.7vmin;text-align:left}
.ayar>span{font-weight:800;font-size:calc(var(--f)*.5);color:var(--soluk);text-transform:uppercase;letter-spacing:.08em}
.sec{display:flex;background:var(--zemin);border-radius:1.6vmin;padding:.5vmin;gap:.5vmin}
.sec button{flex:1;background:transparent;border-radius:1.2vmin;padding:1.1vmin .5vmin;font-weight:800;font-size:calc(var(--f)*.55);color:var(--soluk)}
.sec button.on{background:#fff;color:var(--yazi);box-shadow:0 .3vmin 1vmin rgba(15,23,42,.12)}
.adim{display:flex;align-items:center;background:var(--zemin);border-radius:1.6vmin;padding:.5vmin;gap:.5vmin}
.adim button{width:calc(var(--f)*1.8);background:#fff;border-radius:1.2vmin;padding:.8vmin 0;font-weight:900;font-size:calc(var(--f)*.7)}
.adim b{flex:1;text-align:center;font-size:calc(var(--f)*.7)}
.buyuk{margin-top:1vmin;background:var(--turkuaz);color:#fff;font-weight:900;font-size:calc(var(--f)*.95);padding:1.6vmin 7vmin;border-radius:99px;box-shadow:0 .9vmin 0 #0F766E;transition:transform .1s}
.buyuk:active{transform:translateY(.6vmin);box-shadow:0 .3vmin 0 #0F766E}
.nasil{font-size:calc(var(--f)*.5);color:var(--soluk);line-height:1.5;max-width:90vmin}
/* ---------- Oyun ---------- */
#oyun{flex-direction:column}
.bar{display:flex;align-items:center;gap:1.5vmin;padding:1.6vmin 2.4vmin .8vmin}
.etiket{font-weight:900;font-size:calc(var(--f)*.6);color:#fff;background:var(--k);border-radius:99px;padding:.7vmin 1.8vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.ilerleme{flex:1;display:flex;gap:.6vmin;justify-content:center;flex-wrap:wrap}
.ilerleme i{width:1.6vmin;height:1.6vmin;border-radius:50%;background:#CBD5E1}
.ilerleme i.d{background:var(--turkuaz)}.ilerleme i.y{background:var(--mercan)}.ilerleme i.g{background:#94A3B8}.ilerleme i.s{background:var(--gok);transform:scale(1.35)}
.skorlar{display:flex;gap:1vmin}
.skor{background:#fff;border-radius:1.6vmin;padding:.6vmin 1.6vmin;font-weight:900;font-size:calc(var(--f)*.7);display:flex;align-items:center;gap:.8vmin;border:.35vmin solid transparent;transition:all .25s}
.skor small{font-size:.55em;color:var(--soluk);font-weight:800}
.skor.m{color:var(--mercan)}.skor.t{color:var(--turkuaz)}.skor.g{color:var(--gok)}
.skor.sirada{border-color:currentColor;transform:scale(1.08);box-shadow:0 .6vmin 1.6vmin rgba(15,23,42,.12)}
.araclar{display:flex;gap:.8vmin}
.araclar button{width:6vmin;height:6vmin;min-width:36px;min-height:36px;border-radius:50%;background:#fff;font-size:calc(var(--f)*.6);box-shadow:0 .3vmin 1vmin rgba(15,23,42,.08)}
.sure{height:1.1vmin;min-height:6px;margin:0 2.4vmin;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;visibility:hidden}
.sure.var{visibility:visible}
#sureBar{height:100%;width:100%;background:linear-gradient(90deg,var(--turkuaz),var(--gok));border-radius:99px;transition:width .1s linear}
.sure.az #sureBar{background:var(--mercan)}
.sahne{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:1vmin 3vmin 2vmin;gap:1.5vmin;min-height:0}
.sira{font-weight:900;font-size:calc(var(--f)*.6);padding:.5vmin 1.6vmin;border-radius:99px;color:#fff;display:none}
.sira.var{display:inline-block}
.pano{position:relative;width:min(96vw,150vmin);background:rgba(255,255,255,.9);border-radius:4vmin;padding:4vmin 4vmin 3.5vmin;
  box-shadow:0 1.5vmin 4vmin rgba(2,132,199,.14);border-top:1.2vmin solid var(--k);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2vmin}
.pano.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
.gorev{font-weight:900;font-size:calc(var(--f)*.6);color:var(--soluk);letter-spacing:.06em;text-transform:uppercase}
.en{font-size:calc(var(--f)*2.1);font-weight:900;line-height:1.2}
.en .kal{color:var(--k);text-decoration:underline;text-decoration-thickness:.12em;text-underline-offset:.15em}
.en.gizli{color:#CBD5E1;font-size:calc(var(--f)*1.6)}
.trc{font-size:calc(var(--f)*.85);color:var(--soluk);font-weight:600;font-style:italic}
.trc::before{content:"🇹🇷 ";font-style:normal}
.trc.buyuk-tr{font-size:calc(var(--f)*1.7);color:var(--yazi);font-weight:800;font-style:normal}
.trc.gizli{visibility:hidden}
.durum{font-size:calc(var(--f)*1.8);line-height:1;height:calc(var(--f)*1.8)}
.kontroller{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center}
.kontroller button,.cevap button{font-weight:900;font-size:calc(var(--f)*.62);border-radius:99px;padding:1.4vmin 3.2vmin;background:#fff;color:var(--yazi);box-shadow:0 .6vmin 0 #CBD5E1;transition:transform .1s}
.kontroller button:active,.cevap button:active{transform:translateY(.4vmin);box-shadow:0 .2vmin 0 #CBD5E1}
.kontroller button.ana{background:var(--gok);color:#fff;box-shadow:0 .6vmin 0 #075985;padding:1.4vmin 4.5vmin}
.cevap{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center}
.cevap button.dg{background:var(--turkuaz);color:#fff;box-shadow:0 .6vmin 0 #0F766E}
.cevap button.yn{background:var(--mercan);color:#fff;box-shadow:0 .6vmin 0 #B4382E}
.cevap button:disabled{opacity:.4;pointer-events:none}
/* Söz hakkı (rastgele numara) */
.soz{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:55}
.soz.acik{display:flex}
.soz div{background:#fff;border-radius:4vmin;padding:4vmin 8vmin;text-align:center;box-shadow:0 2vmin 6vmin rgba(15,23,42,.3)}
.soz small{display:block;font-weight:800;color:var(--soluk);font-size:calc(var(--f)*.6);letter-spacing:.1em}
.soz b{display:block;font-size:calc(var(--f)*5);font-weight:900;color:var(--kehribar);line-height:1.1}
.soz p{margin:0 0 2vmin;color:var(--soluk);font-weight:700;font-size:calc(var(--f)*.55)}
.soz button{font-weight:900;font-size:calc(var(--f)*.6);border-radius:99px;padding:1.2vmin 3.5vmin;margin:0 .6vmin;background:var(--zemin)}
.soz button.ana{background:var(--kehribar);color:#fff}
/* Bitiş */
#bitis{align-items:center;justify-content:center;padding:2vmin}
.bitis-kart{background:rgba(255,255,255,.95);border-radius:4vmin;padding:4vmin 6vmin;text-align:center;box-shadow:0 2vmin 6vmin rgba(2,132,199,.18);display:flex;flex-direction:column;align-items:center;gap:1.6vmin;max-width:94vw}
.kupa{font-size:16vmin;line-height:1;animation:zipla 1.2s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0)}50%{transform:translateY(-2vmin)}}
.bitis-bas{font-size:calc(var(--f)*1.4);font-weight:900}
.yildiz{font-size:8vmin;letter-spacing:1vmin}
.yildiz b{color:#CBD5E1;font-weight:400}
.bitis-skor{display:flex;gap:3vmin}
.bitis-skor div{background:var(--zemin);border-radius:2vmin;padding:1.6vmin 3vmin;font-weight:900;font-size:calc(var(--f)*1.1)}
.bitis-skor small{display:block;font-size:.45em;color:var(--soluk)}
.bitis-btn{display:flex;gap:1.6vmin;margin-top:1vmin}
.bitis-btn button{font-weight:900;font-size:calc(var(--f)*.65);border-radius:99px;padding:1.5vmin 4vmin;background:#fff;box-shadow:0 .6vmin 0 #CBD5E1}
.bitis-btn button.ana{background:var(--turkuaz);color:#fff;box-shadow:0 .6vmin 0 #0F766E}
.onay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:60}
.onay.acik{display:flex}
.onay div{background:#fff;border-radius:3vmin;padding:3vmin 4vmin;text-align:center;font-weight:800;font-size:calc(var(--f)*.7)}
.onay p{margin:0 0 2vmin}
.onay button{font-weight:900;font-size:calc(var(--f)*.6);border-radius:99px;padding:1.2vmin 3.5vmin;margin:0 .6vmin;background:var(--zemin)}
.onay button.ana{background:var(--mercan);color:#fff}
#konfeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#konfeti i{position:absolute;top:-4vmin;width:1.4vmin;height:2.2vmin;border-radius:.3vmin;animation:dus linear forwards}
@keyframes dus{to{transform:translateY(110vh) rotate(720deg)}}
@media (orientation:portrait){
  :root{--f:clamp(16px,4.8vmin,32px)}
  .ayarlar{grid-template-columns:1fr}.etiket{max-width:40vw}.en{font-size:calc(var(--f)*1.6)}
}
</style></head><body>
<div id="arka"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span></div>

<section id="giris" class="ekran aktif">
  <div class="giris-kart">
    <div class="logo"><i>a</i><i>m</i><i>i</i><i>s</i></div>
    <div class="ust-yazi">PATTERN BOARD</div>
    <h1>Kalıp Tahtası</h1>
    <div class="alt">__ALT__</div>
    __IMZA__
    <div class="etk">Kalıp</div>
    <div class="kaliplar" id="kaliplar"></div>
    <div class="ayarlar">
      <div class="ayar"><span>Mod</span><div class="sec" data-k="mod"><button data-v="oku">📖 Oku-tekrarla</button><button data-v="cevir">🔁 Türkçeden çevir</button></div></div>
      <div class="ayar"><span>Oyuncu</span><div class="sec" data-k="oyuncu"><button data-v="tek">👤 Sınıf</button><button data-v="takim">👥 İki takım</button></div></div>
      <div class="ayar"><span>Sıra</span><div class="sec" data-k="sira"><button data-v="kolay">Kolaydan zora</button><button data-v="karisik">🔀 Karışık</button></div></div>
      <div class="ayar"><span>Süre (her cümle)</span><div class="sec" data-k="sure"><button data-v="0">Yok</button><button data-v="30">30 sn</button><button data-v="60">60 sn</button></div></div>
      <div class="ayar"><span>Sınıf mevcudu (🎲 söz için)</span><div class="adim"><button id="mevEksi">−</button><b id="mev"></b><button id="mevArti">＋</button></div></div>
    </div>
    <button id="basla" class="buyuk">Başla ▶</button>
  </div>
</section>

<section id="oyun" class="ekran">
  <header class="bar">
    <div class="etiket" id="etiket"></div>
    <div class="ilerleme" id="ilerleme"></div>
    <div class="skorlar" id="skorlar"></div>
    <div class="araclar"><button id="sesBtn" title="Ses">🔊</button><button id="tamBtn" title="Tam ekran">⛶</button><button id="cikBtn" title="Ana ekran">✕</button></div>
  </header>
  <div class="sure" id="sureKap"><div id="sureBar"></div></div>
  <main class="sahne">
    <div class="sira" id="sira"></div>
    <div class="pano" id="pano">
      <div class="gorev" id="gorev"></div>
      <div class="en" id="en"></div>
      <div class="trc" id="trc"></div>
      <div class="durum" id="durum"></div>
    </div>
    <div class="cevap">
      <button id="sozBtn">🎲 Söz</button>
      <button id="dogruBtn" class="dg">✓ Doğru</button>
      <button id="yanlisBtn" class="yn">✗ Yanlış</button>
    </div>
    <div class="kontroller">
      <button id="oncekiBtn">◀</button>
      <button id="dinleBtn" class="ana">🔊 Dinle</button>
      <button id="cevapBtn">👁 Cevap</button>
      <button id="sonrakiBtn">▶</button>
    </div>
  </main>
</section>

<section id="bitis" class="ekran">
  <div class="bitis-kart">
    <div class="kupa">🏆</div>
    <div class="bitis-bas" id="bitisBas"></div>
    <div class="yildiz" id="yildiz"></div>
    <div class="bitis-skor" id="bitisSkor"></div>
    <div class="bitis-btn"><button id="ayarBtn">⚙︎ Ayarlar</button><button id="tekrarBtn" class="ana">↻ Tekrar oyna</button></div>
  </div>
</section>

<div class="soz" id="soz"><div><small>SÖZ SIRASI</small><b id="sozNo"></b><p id="sozBilgi"></p><button id="sozKapat">Tamam</button><button id="sozYeni" class="ana">🎲 Başka</button></div></div>
<div class="onay" id="onay"><div><p>Oyun bitirilsin mi?</p><button id="hayirBtn">Devam et</button><button id="evetBtn" class="ana">Bitir</button></div></div>
<div id="konfeti"></div>

<script>
/*__HAVUZ__*/
/*__SESLER__*/
// Havuz: [{ ad, tr, renk, emoji, cumleler: [[İngilizce, Türkçe, kalıp parçası, seviye], …] }, …] — src/data/patterns.js'ten.
const ORNEK=[{ad:'am / is / are',tr:'olmak (to be)',renk:'#0D9488',emoji:'🟦',cumleler:[['I am happy.','Ben mutluyum.','am',1],['You are my friend.','Sen benim arkadaşımsın.','are',2],['She is a doctor.','O bir doktor.','is',2]]}];
const KALIPLAR=(typeof HAVUZ!=='undefined'&&HAVUZ&&HAVUZ.length)?HAVUZ:ORNEK;
const TAKIM=[{ad:'Mercan',sinif:'m',renk:'var(--mercan)'},{ad:'Turkuaz',sinif:'t',renk:'var(--turkuaz)'}];
const $=id=>document.getElementById(id);
const oku=(k,v)=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):v}catch(e){return v}};
const yaz=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function karistir(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const kac=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// --- ses ---
let AC=null,sessiz=oku('mamoste-kalip-sessiz',false);
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function ton(f,t0,d,tip,v){const a=ac();if(!a||sessiz)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=tip||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const ses={
  tik:()=>ton(700,0,.07,'triangle',.1),
  dogru:()=>[523,659,784,1047].forEach((f,i)=>ton(f,i*.09,.3,'triangle',.16)),
  yanlis:()=>{ton(220,0,.22,'sawtooth',.06);ton(165,.12,.3,'sawtooth',.06)},
  saat:()=>ton(1200,0,.04,'square',.04),
  zar:()=>[880,660,990,740,1100].forEach((f,i)=>ton(f,i*.06,.08,'triangle',.08)),
  final:()=>[523,659,784,659,784,1047,1319].forEach((f,i)=>ton(f,i*.12,.4,'triangle',.15))
};
let SES=null;
function sesSec(){try{const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^en[-_]/i.test(v.lang));if(!vs.length)return null;
  const puan=v=>{const n=(v.name+' '+(v.voiceURI||'')).toLowerCase();let p=/^en[-_]us/i.test(v.lang)?30:/^en[-_]gb/i.test(v.lang)?25:10;
    [['natural',90],['neural',90],['online',50],['google us english',70],['google uk english',60],['google',40],['samantha',60],['premium',60],['enhanced',55],['aria',40],['jenny',40],['ava',40],['guy',30],['allison',30]].forEach(([k,s])=>{if(n.includes(k))p+=s});
    if(/\b(david|zira|mark|hazel|george|susan)\b|compact|eloquence|espeak/.test(n))p-=40;if(v.localService===false)p+=10;return p};
  return vs.slice().sort((a,b)=>puan(b)-puan(a))[0]}catch(e){return null}}
if(window.speechSynthesis){SES=sesSec();try{speechSynthesis.addEventListener('voiceschanged',()=>{SES=sesSec()})}catch(e){}}
// Önce gömülü doğal ses (SESLER); yoksa cihazın İngilizce sesi; o da yoksa okunmaz (Türkçe sesle yanlış telaffuz olmasın).
let CALAN=null;
const gomuluSes=t=>{try{return typeof SESLER!=='undefined'&&SESLER?SESLER[String(t).trim()]:null}catch(e){return null}};
const sesVar=()=>{try{return(typeof SESLER!=='undefined'&&SESLER&&Object.keys(SESLER).length>0)||!!window.speechSynthesis}catch(e){return false}};
function sus(){try{if(CALAN){CALAN.pause();CALAN=null}if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
function konus(t){try{sus();const b=gomuluSes(t);
  if(b){CALAN=new Audio('data:audio/mpeg;base64,'+b);CALAN.play().catch(()=>{});return}
  const s=window.speechSynthesis;if(!s)return;if(!SES)SES=sesSec();if(!SES)return;const u=new SpeechSynthesisUtterance(t);
  u.lang=SES.lang;u.rate=.85;u.pitch=1;u.voice=SES;s.speak(u)}catch(e){}}
if(!sesVar())$('dinleBtn').style.display='none';

// --- ayarlar ---
const AYAR=Object.assign({kalip:0,mod:'oku',oyuncu:'tek',sira:'kolay',sure:'0',mevcut:30},oku('mamoste-kalip-ayar',{}));
if(!KALIPLAR[AYAR.kalip])AYAR.kalip=0;
const kaydet=()=>yaz('mamoste-kalip-ayar',AYAR);
function kalipCiz(){const el=$('kaliplar');el.innerHTML='';KALIPLAR.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k.ad;b.title=k.tr||'';
  b.style.setProperty('--c',k.renk);b.classList.toggle('on',i===AYAR.kalip);b.onclick=()=>{AYAR.kalip=i;kaydet();ses.tik();kalipCiz()};el.appendChild(b)})}
kalipCiz();
document.querySelectorAll('.sec').forEach(sec=>{
  const k=sec.dataset.k;
  const boya=()=>sec.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===AYAR[k]));
  sec.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;AYAR[k]=b.dataset.v;kaydet();boya();ses.tik()});
  boya();
});
function mevCiz(){$('mev').textContent=AYAR.mevcut?AYAR.mevcut+' öğrenci':'Kapalı'}
$('mevEksi').onclick=()=>{AYAR.mevcut=Math.max(0,AYAR.mevcut-1);kaydet();mevCiz();ses.tik()};
$('mevArti').onclick=()=>{AYAR.mevcut=Math.min(60,AYAR.mevcut+1);kaydet();mevCiz();ses.tik()};
mevCiz();

// --- oyun durumu ---
let K=null,liste=[],i=0,acik=false,sonuclar=[],puan=[0,0],sira=0,zaman=null,sonSaniye=-1,sozler=[];

function ekran(id){document.querySelectorAll('.ekran').forEach(e=>e.classList.toggle('aktif',e.id===id))}
function basla(){
  ac();K=KALIPLAR[AYAR.kalip];
  liste=K.cumleler.slice();if(AYAR.sira==='karisik')karistir(liste);else liste.sort((a,b)=>(a[3]||1)-(b[3]||1));
  i=0;sonuclar=[];puan=[0,0];sira=0;sozler=[];
  document.documentElement.style.setProperty('--k',K.renk);
  $('etiket').textContent=(K.emoji?K.emoji+' ':'')+K.ad;
  $('sozBtn').style.display=AYAR.mevcut?'':'none';
  ekran('oyun');goster();
}
// Kalıp parçasını (büyük/küçük harf duyarsız ilk eşleşme) renkli göster.
function vurgula(c,p){const s=String(c);if(!p)return kac(s);const j=s.toLowerCase().indexOf(String(p).toLowerCase());
  if(j<0)return kac(s);return kac(s.slice(0,j))+'<span class="kal">'+kac(s.slice(j,j+p.length))+'</span>'+kac(s.slice(j+p.length))}
function goster(){
  const q=liste[i],cevir=AYAR.mod==='cevir';
  $('gorev').textContent=cevir?'Say it in English!':'Read and repeat!';
  const enG=!cevir||acik;
  $('en').innerHTML=enG?vurgula(q[0],q[2]):'🇬🇧 ?';$('en').classList.toggle('gizli',!enG);
  const tr=$('trc');tr.textContent=q[1]||'';tr.classList.toggle('buyuk-tr',cevir&&!acik);tr.classList.toggle('gizli',!cevir&&!acik);
  $('durum').textContent=sonuclar[i]==='d'?'✅':sonuclar[i]==='y'?'❌':'';
  $('cevapBtn').textContent=acik?'👁 Gizle':'👁 Cevap';
  const bitti=!!sonuclar[i];$('dogruBtn').disabled=bitti;$('yanlisBtn').disabled=bitti;
  $('sonrakiBtn').textContent=i+1<liste.length?'▶':'🏆';
  const p=$('pano');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');
  ilerlemeCiz();skorCiz();
}
function git(n){sus();const y=i+n;if(y>=liste.length){bitis();return}if(y<0)return;i=y;acik=false;goster();zamanBaslat();ses.tik()}
function cevapla(ok){
  if(sonuclar[i])return;zamanDur();sonuclar[i]=ok?'d':'y';
  if(AYAR.oyuncu==='takim'){if(ok)puan[sira]++;sira=1-sira}else if(ok)puan[0]++;
  acik=true;goster();
  if(ok){ses.dogru();konfeti(30);if(!sessiz)setTimeout(()=>konus(liste[i][0]),350)}else ses.yanlis();
}
function ilerlemeCiz(){const el=$('ilerleme');el.innerHTML='';liste.forEach((q,j)=>{const d=document.createElement('i');d.className=j===i?'s':(sonuclar[j]||'');el.appendChild(d)})}
function skorCiz(){
  const el=$('skorlar');el.innerHTML='';const s=$('sira');
  if(AYAR.oyuncu==='takim'){
    TAKIM.forEach((t,j)=>{const d=document.createElement('div');d.className='skor '+t.sinif+(j===sira&&!sonuclar[i]?' sirada':'');d.innerHTML=`<small>${t.ad}</small>${puan[j]}`;el.appendChild(d)});
    s.textContent=`Sıra: ${TAKIM[sira].ad} Takımı`;s.style.background=TAKIM[sira].renk;s.classList.add('var');
  }else{
    const d=document.createElement('div');d.className='skor g';d.innerHTML=`<small>DOĞRU</small>${puan[0]}`;el.appendChild(d);s.classList.remove('var');
  }
}

// --- süre ---
function zamanBaslat(){
  zamanDur();const sn=+AYAR.sure;$('sureKap').classList.toggle('var',sn>0&&!sonuclar[i]);$('sureKap').classList.remove('az');$('sureBar').style.width='100%';
  if(!sn||sonuclar[i])return;const bit=Date.now()+sn*1000;sonSaniye=-1;
  zaman=setInterval(()=>{const kalan=Math.max(0,bit-Date.now());$('sureBar').style.width=(kalan/(sn*10))+'%';
    const s=Math.ceil(kalan/1000);if(s<=5){$('sureKap').classList.add('az');if(s!==sonSaniye&&s>0){sonSaniye=s;ses.saat()}}
    if(!kalan){zamanDur();ses.yanlis();if(!acik){acik=true;goster()}}},100);
}
function zamanDur(){if(zaman){clearInterval(zaman);zaman=null}}

// --- söz: tekrar etmeden rastgele numara ---
function soz(){
  const n=AYAR.mevcut;if(!n)return;
  if(sozler.length>=n)sozler=[];
  const aday=[];for(let k=1;k<=n;k++)if(sozler.indexOf(k)<0)aday.push(k);
  const no=aday[Math.floor(Math.random()*aday.length)];sozler.push(no);
  $('sozNo').textContent=no;$('sozBilgi').textContent=`${sozler.length}/${n} öğrenci söz aldı`;
  $('soz').classList.add('acik');ses.zar();
}

// --- bitiş ---
function bitis(){
  zamanDur();sus();ekran('bitis');ses.final();konfeti(120);
  const bas=$('bitisBas'),sk=$('bitisSkor'),y=$('yildiz');sk.innerHTML='';
  if(AYAR.oyuncu==='takim'){
    bas.textContent=puan[0]===puan[1]?'Berabere! 🤝':`${TAKIM[puan[0]>puan[1]?0:1].ad} Takımı kazandı!`;
    TAKIM.forEach((t,j)=>{const d=document.createElement('div');d.style.color=t.renk;d.innerHTML=`${puan[j]}<small>${t.ad}</small>`;sk.appendChild(d)});y.innerHTML='';
  }else{
    const oran=liste.length?puan[0]/liste.length:0,yil=oran>=.85?3:oran>=.6?2:oran>=.3?1:0;
    bas.textContent=['Keep practising!','Good job!','Great work!','Superstar!'][yil];
    y.innerHTML='⭐'.repeat(yil)+'<b>☆</b>'.repeat(3-yil);
    const d=document.createElement('div');d.innerHTML=`${puan[0]}<small>/ ${liste.length} doğru</small>`;sk.appendChild(d);
  }
}
function konfeti(n){const k=$('konfeti');const r=['#E2574C','#0D9488','#0284C7','#D99A1E','#FDE68A'];
  for(let j=0;j<(n||60);j++){const c=document.createElement('i');c.style.left=Math.random()*100+'vw';c.style.background=r[j%r.length];
    c.style.animationDuration=(1.4+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.4)+'s';k.appendChild(c);
    setTimeout(()=>c.remove(),3600)}}

// --- düğmeler ---
$('basla').onclick=()=>{basla();zamanBaslat()};
$('oncekiBtn').onclick=()=>git(-1);$('sonrakiBtn').onclick=()=>git(1);
$('cevapBtn').onclick=()=>{acik=!acik;goster();ses.tik()};
$('dinleBtn').onclick=()=>{ac();konus(liste[i][0])};
$('dogruBtn').onclick=()=>cevapla(true);$('yanlisBtn').onclick=()=>cevapla(false);
$('sozBtn').onclick=soz;$('sozYeni').onclick=soz;$('sozKapat').onclick=()=>$('soz').classList.remove('acik');
$('tekrarBtn').onclick=()=>{basla();zamanBaslat()};$('ayarBtn').onclick=()=>ekran('giris');
$('cikBtn').onclick=()=>$('onay').classList.add('acik');
$('hayirBtn').onclick=()=>$('onay').classList.remove('acik');
$('evetBtn').onclick=()=>{$('onay').classList.remove('acik');zamanDur();sus();ekran('giris')};
function sesCiz(){$('sesBtn').textContent=sessiz?'🔇':'🔊'}sesCiz();
$('sesBtn').onclick=()=>{sessiz=!sessiz;yaz('mamoste-kalip-sessiz',sessiz);sesCiz();if(sessiz)sus()};
const tamEkranVar=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
if(!tamEkranVar)$('tamBtn').style.display='none';
$('tamBtn').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}};
// Klavye (öğretmen bilgisayarı): ← → gezin, boşluk = cevap, D/Y = doğru/yanlış, S = söz
document.addEventListener('keydown',e=>{if(!$('oyun').classList.contains('aktif'))return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'||k==='enter'){e.preventDefault();git(1)}else if(k==='arrowleft'){e.preventDefault();git(-1)}
  else if(k===' '){e.preventDefault();acik=!acik;goster()}else if(k==='d')cevapla(true);else if(k==='y')cevapla(false);else if(k==='s')soz()});
// --- Uzaktan kumanda: Okul Tahta sayfası (iframe'in sahibi) telefondan gelen komutu postMessage ile iletir;
// oyun her değişiklikte durumunu geri bildirir (telefonda cümle, puan, sıra görünsün). Tek dosya olarak açılınca etkisiz.
const USTTE=window.parent&&window.parent!==window;
let sozSon=null;
function aktifEkran(){const e=document.querySelector('.ekran.aktif');return e?e.id:'giris'}
function bildir(){if(!USTTE)return;try{const q=liste[i]||null;parent.postMessage({mamoste:'durum',oyun:'kalip',ekran:aktifEkran(),kaliplar:KALIPLAR.map(k=>k.ad),kalip:AYAR.kalip,mod:AYAR.mod,oyuncu:AYAR.oyuncu,
  en:q?q[0]:'',tr:q?q[1]:'',acik,i,n:liste.length,sonuc:sonuclar[i]||null,puan,sira,soz:sozSon,mevcut:AYAR.mevcut},'*')}catch(e){}}
function ayarCiz(){document.querySelectorAll('.sec').forEach(sec=>sec.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===AYAR[sec.dataset.k])));kalipCiz()}
// Mevcut işlevleri sar: her değişiklikten sonra durum bildirilsin.
[['goster'],['ekran'],['bitis'],['kalipCiz']].forEach(([ad])=>{const eski=window[ad];window[ad]=function(){const r=eski.apply(this,arguments);bildir();return r}});
const sozEski=soz;soz=function(){sozEski();sozSon=sozler[sozler.length-1]||null;bildir()};
$('sozBtn').onclick=soz;$('sozYeni').onclick=soz;
window.addEventListener('message',e=>{const m=e.data;if(!m||m.mamoste!=='komut')return;const oyunda=aktifEkran()==='oyun';
  switch(m.k){
    case 'durum':bildir();break;
    case 'kalip':if(KALIPLAR[m.i]){AYAR.kalip=m.i;kaydet();ayarCiz()}break;
    case 'ayar':if(m.ad&&m.v!=null){AYAR[m.ad]=String(m.v);kaydet();ayarCiz()}break;
    case 'basla':basla();zamanBaslat();break;
    case 'giris':zamanDur();sus();$('soz').classList.remove('acik');ekran('giris');break;
    case 'sonraki':if(oyunda)git(1);break;
    case 'onceki':if(oyunda)git(-1);break;
    case 'cevap':if(oyunda){acik=!acik;goster()}break;
    case 'dogru':if(oyunda)cevapla(true);break;
    case 'yanlis':if(oyunda)cevapla(false);break;
    case 'soz':if(oyunda)soz();break;
    case 'sozKapat':$('soz').classList.remove('acik');break;
    case 'dinle':if(oyunda){ac();konus(liste[i][0])}break;
  }
});
bildir();
if(window.speechSynthesis)try{speechSynthesis.getVoices()}catch(e){}
</script>
</body></html>
